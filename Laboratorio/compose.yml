services: # Punto 1: Definición de servicios
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    networks:
      - lemoncode-network
    ports:
      - "${MONGO_PORT}:27017" # Exponer el puerto de MongoDB
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  topics-api:
    build: ./node-stack/backend
    container_name: topics-api
    networks:
      - lemoncode-network
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}" # Exponer el puerto del backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_NAME: ${DATABASE_NAME}
      PORT: ${BACKEND_PORT}
    depends_on: # Asegurar que el backend espere a que MongoDB esté saludable
      mongodb:
        condition: service_healthy

  lemoncode-frontend:
    build: ./node-stack/frontend
    container_name: lemoncode-frontend
    networks:
      - lemoncode-network
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}" # Exponer el puerto del frontend
    environment:
      API_URL: ${API_URL}
    depends_on: # Esperar a que el backend esté listo antes de iniciar el frontend
      - topics-api

networks: # Punto 2: Definición de red
  lemoncode-network:
    driver: bridge

volumes: # Punto 3: Definición de volúmenes
  mongo-data: